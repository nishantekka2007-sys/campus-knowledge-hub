<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Knowledge Hub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            line-height: 1.6;
        }

        header {
            background: #111827;
            color: white;
            padding: 50px 20px;
        }

        .header-content {
            max-width: 1100px;
            margin: auto;
        }

        header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        header p {
            color: #d1d5db;
            font-size: 18px;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .add-section {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 30px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
        }

        .add-section h2 {
            margin-bottom: 18px;
            color: #111827;
        }

        .resource-form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .resource-form input,
        .resource-form textarea {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            font-family: inherit;
        }

        .resource-form textarea {
            grid-column: 1 / -1;
            min-height: 100px;
            resize: vertical;
        }

        .resource-form input:focus,
        .resource-form textarea:focus {
            border-color: #2563eb;
        }

        .form-button {
            grid-column: 1 / -1;
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px 18px;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .form-button:hover {
            background: #1d4ed8;
        }

        .form-message {
            grid-column: 1 / -1;
            min-height: 24px;
            font-size: 14px;
            font-weight: bold;
        }

        .toolbar {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .search-box,
        .type-filter,
        .favorite-filter {
            padding: 14px 16px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .type-filter,
        .favorite-filter {
            min-width: 160px;
            cursor: pointer;
        }

        .search-box:focus,
        .type-filter:focus,
        .favorite-filter:focus {
            border-color: #2563eb;
        }

        .resource-count {
            display: flex;
            align-items: center;
            padding: 0 15px;
            font-weight: bold;
            color: #4b5563;
        }

        #resources {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .resource-card {
            position: relative;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .resource-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .resource-card h2 {
            font-size: 22px;
            margin-bottom: 12px;
            color: #111827;
            padding-right: 10px;
        }

        .resource-card p {
            margin-bottom: 8px;
            color: #4b5563;
        }

        .description {
            margin-top: 12px;
            padding: 12px;
            background: #f9fafb;
            border-radius: 9px;
            color: #4b5563;
            white-space: pre-wrap;
        }

        .badge {
            display: inline-block;
            background: #e5edff;
            color: #1d4ed8;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .favorite-badge {
            display: inline-block;
            margin-left: 8px;
            color: #92400e;
            background: #fef3c7;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: bold;
        }

        .resource-link {
            display: inline-block;
            margin-top: 15px;
            color: white;
            background: #2563eb;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
        }

        .resource-link:hover {
            background: #1d4ed8;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .edit-button,
        .delete-button,
        .favorite-button {
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .edit-button {
            background: #e5e7eb;
            color: #111827;
        }

        .edit-button:hover {
            background: #d1d5db;
        }

        .delete-button {
            background: #fee2e2;
            color: #b91c1c;
        }

        .delete-button:hover {
            background: #fecaca;
        }

        .favorite-button {
            background: #f3f4f6;
            color: #374151;
        }

        .favorite-button:hover {
            background: #e5e7eb;
        }

        .favorite-button.active {
            background: #fef3c7;
            color: #92400e;
        }

        .message {
            background: white;
            padding: 30px;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            text-align: center;
            color: #6b7280;
            grid-column: 1 / -1;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #6b7280;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            header h1 {
                font-size: 32px;
            }

            header {
                padding: 35px 20px;
            }

            main {
                margin-top: 25px;
            }

            .resource-form {
                grid-template-columns: 1fr;
            }

            .resource-form textarea {
                grid-column: auto;
            }

            .search-box,
            .type-filter,
            .favorite-filter {
                width: 100%;
            }

            .resource-count {
                width: 100%;
                justify-content: center;
                padding: 5px 0;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-content">
            <h1>Campus Knowledge Hub</h1>
            <p>Find and manage college learning resources in one place.</p>
        </div>
    </header>

    <main>

        <section class="add-section">
            <h2>Add a Resource</h2>

            <form id="resourceForm" class="resource-form">

                <input
                    type="text"
                    id="subject"
                    placeholder="Subject"
                    required
                >

                <input
                    type="text"
                    id="title"
                    placeholder="Resource title"
                    required
                >

                <input
                    type="text"
                    id="resourceType"
                    placeholder="Type (Notes, Course, Video...)"
                    required
                >

                <input
                    type="url"
                    id="link"
                    placeholder="https://example.com"
                    required
                >

                <textarea
                    id="description"
                    placeholder="Short description (optional, max 500 characters)"
                    maxlength="500"
                ></textarea>

                <button type="submit" class="form-button">
                    Add Resource
                </button>

                <div id="formMessage" class="form-message"></div>

            </form>
        </section>

        <div class="toolbar">

            <input
                type="text"
                id="searchInput"
                class="search-box"
                placeholder="Search by subject, title, type, or description..."
            >

            <select id="typeFilter" class="type-filter">
                <option value="">All Types</option>
            </select>

            <select id="favoriteFilter" class="favorite-filter">
                <option value="">All Resources</option>
                <option value="favorites">Favorites Only</option>
            </select>

            <div class="resource-count" id="resourceCount">
                Loading...
            </div>

        </div>

        <div id="resources">
            <div class="message">
                Loading resources...
            </div>
        </div>

    </main>

    <footer>
        Campus Knowledge Hub
    </footer>

    <script>

        let allResources = [];


        async function loadResources() {

            try {

                const response = await fetch("/resources");

                if (!response.ok) {
                    throw new Error("Failed to load resources");
                }

                allResources = await response.json();

                updateTypeFilterOptions();
                applyFilters();

            } catch (error) {

                document.getElementById("resources").innerHTML = `
                    <div class="message">
                        Unable to load resources.
                    </div>
                `;

                document.getElementById("resourceCount").textContent = "Error";
            }
        }


        function updateTypeFilterOptions() {

            const typeFilter =
                document.getElementById("typeFilter");

            const currentValue = typeFilter.value;

            const types = [
                ...new Set(
                    allResources.map(resource =>
                        resource.resource_type.trim()
                    )
                )
            ].sort((a, b) => a.localeCompare(b));

            typeFilter.innerHTML = `
                <option value="">All Types</option>
            `;

            types.forEach(type => {

                const option =
                    document.createElement("option");

                option.value = type;
                option.textContent = type;

                typeFilter.appendChild(option);
            });

            if (types.includes(currentValue)) {
                typeFilter.value = currentValue;
            }
        }


        function applyFilters() {

            const keyword = document
                .getElementById("searchInput")
                .value
                .toLowerCase()
                .trim();

            const selectedType = document
                .getElementById("typeFilter")
                .value
                .toLowerCase()
                .trim();

            const favoriteFilter =
                document.getElementById("favoriteFilter").value;

            const filteredResources = allResources.filter(resource => {

                const description =
                    (resource.description || "").toLowerCase();

                const matchesSearch =
                    resource.subject.toLowerCase().includes(keyword) ||
                    resource.title.toLowerCase().includes(keyword) ||
                    resource.resource_type.toLowerCase().includes(keyword) ||
                    description.includes(keyword);

                const matchesType =
                    !selectedType ||
                    resource.resource_type.toLowerCase() === selectedType;

                const matchesFavorite =
                    favoriteFilter !== "favorites" ||
                    resource.is_favorite === true;

                return (
                    matchesSearch &&
                    matchesType &&
                    matchesFavorite
                );
            });

            displayResources(filteredResources);
        }


        function displayResources(resources) {

            const container =
                document.getElementById("resources");

            const count =
                document.getElementById("resourceCount");

            count.textContent =
                `${resources.length} resource${resources.length === 1 ? "" : "s"}`;

            if (resources.length === 0) {

                container.innerHTML = `
                    <div class="message">
                        No resources found.
                    </div>
                `;

                return;
            }

            container.innerHTML = resources.map(resource => `

                <article class="resource-card">

                    <span class="badge">
                        ${escapeHtml(resource.resource_type)}
                    </span>

                    ${
                        resource.is_favorite
                            ? `<span class="favorite-badge">★ Favorite</span>`
                            : ""
                    }

                    <h2>
                        ${escapeHtml(resource.title)}
                    </h2>

                    <p>
                        <strong>Subject:</strong>
                        ${escapeHtml(resource.subject)}
                    </p>

                    ${
                        resource.description
                            ? `
                                <div class="description">
                                    <strong>Description:</strong><br>
                                    ${escapeHtml(resource.description)}
                                </div>
                              `
                            : ""
                    }

                    <a
                        class="resource-link"
                        href="${escapeAttribute(resource.link)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Open Resource
                    </a>

                    <div class="card-actions">

                        <button
                            class="favorite-button ${resource.is_favorite ? "active" : ""}"
                            onclick="toggleFavorite(${resource.id})"
                        >
                            ${resource.is_favorite ? "★ Favorited" : "☆ Favorite"}
                        </button>

                        <button
                            class="edit-button"
                            onclick="editResource(${resource.id})"
                        >
                            Edit
                        </button>

                        <button
                            class="delete-button"
                            onclick="deleteResource(${resource.id})"
                        >
                            Delete
                        </button>

                    </div>

                </article>

            `).join("");
        }


        function escapeHtml(value) {

            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }


        function escapeAttribute(value) {
            return escapeHtml(value);
        }


        document
            .getElementById("searchInput")
            .addEventListener("input", applyFilters);


        document
            .getElementById("typeFilter")
            .addEventListener("change", applyFilters);


        document
            .getElementById("favoriteFilter")
            .addEventListener("change", applyFilters);


        document
            .getElementById("resourceForm")
            .addEventListener("submit", async function (event) {

                event.preventDefault();

                const message =
                    document.getElementById("formMessage");

                const resource = {

                    subject:
                        document.getElementById("subject").value.trim(),

                    title:
                        document.getElementById("title").value.trim(),

                    resource_type:
                        document.getElementById("resourceType").value.trim(),

                    link:
                        document.getElementById("link").value.trim(),

                    description:
                        document.getElementById("description").value.trim()
                };

                message.textContent = "Adding resource...";

                try {

                    const response = await fetch("/resources", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(resource)
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(
                            Array.isArray(result.detail)
                                ? result.detail
                                      .map(error => error.msg)
                                      .join(", ")
                                : result.detail ||
                                  "Failed to add resource"
                        );
                    }

                    message.textContent =
                        "Resource added successfully.";

                    this.reset();

                    await loadResources();

                } catch (error) {

                    message.textContent = error.message;
                }
            });


        async function toggleFavorite(resourceId) {

            try {

                const response = await fetch(
                    `/resources/${resourceId}/favorite`,
                    {
                        method: "PATCH"
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.detail ||
                        "Failed to update favorite status"
                    );
                }

                await loadResources();

            } catch (error) {

                alert(error.message);
            }
        }


        async function deleteResource(resourceId) {

            const resource = allResources.find(
                item => item.id === resourceId
            );

            if (!resource) {
                return;
            }

            const confirmed = confirm(
                `Delete "${resource.title}"?`
            );

            if (!confirmed) {
                return;
            }

            try {

                const response = await fetch(
                    `/resources/${resourceId}`,
                    {
                        method: "DELETE"
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.detail ||
                        "Failed to delete resource"
                    );
                }

                await loadResources();

            } catch (error) {

                alert(error.message);
            }
        }


        async function editResource(resourceId) {

            const resource = allResources.find(
                item => item.id === resourceId
            );

            if (!resource) {
                return;
            }

            const subject = prompt(
                "Subject:",
                resource.subject
            );

            if (subject === null) {
                return;
            }

            const title = prompt(
                "Title:",
                resource.title
            );

            if (title === null) {
                return;
            }

            const resourceType = prompt(
                "Type:",
                resource.resource_type
            );

            if (resourceType === null) {
                return;
            }

            const link = prompt(
                "Link:",
                resource.link
            );

            if (link === null) {
                return;
            }

            const description = prompt(
                "Description:",
                resource.description || ""
            );

            if (description === null) {
                return;
            }

            try {

                const response = await fetch(
                    `/resources/${resourceId}`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            subject:
                                subject.trim(),

                            title:
                                title.trim(),

                            resource_type:
                                resourceType.trim(),

                            link:
                                link.trim(),

                            description:
                                description.trim()
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        Array.isArray(result.detail)
                            ? result.detail
                                  .map(error => error.msg)
                                  .join(", ")
                            : result.detail ||
                              "Failed to update resource"
                    );
                }

                await loadResources();

            } catch (error) {

                alert(error.message);
            }
        }


        loadResources();

    </script>

</body>
</html>
